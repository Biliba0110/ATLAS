<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ATLAS dashboard preview</title>
  <desc id="desc">A stylized preview of the ATLAS dashboard with summary cards, quick actions, current state, and recent activity.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140714"/>
      <stop offset="0.48" stop-color="#230a22"/>
      <stop offset="1" stop-color="#110611"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55315a" stop-opacity="0.74"/>
      <stop offset="0.48" stop-color="#2a172c" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#180b19" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4b2b51" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#1b0d1d" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb9ff"/>
      <stop offset="0.52" stop-color="#e86cff"/>
      <stop offset="1" stop-color="#9c53ff"/>
    </linearGradient>
    <linearGradient id="okLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e6bd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8bd7ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.86 0 1 0 0 0.32 0 0 1 0 1 0 0 0 0.42 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .screen { fill: url(#page); }
      .panel { fill: url(#panel); stroke: rgba(255,255,255,.12); stroke-width: 1.5; }
      .panel-soft { fill: url(#panelSoft); stroke: rgba(255,255,255,.12); stroke-width: 1.5; }
      .muted { fill: #aaa1bd; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #f7f0fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #b8adc7; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 8px; }
      .button { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.13); stroke-width: 1.5; }
      .metric { font-size: 42px; font-weight: 800; }
      .small { font-size: 18px; }
      .body { font-size: 20px; line-height: 1.45; }
      .title { font-size: 64px; font-weight: 850; letter-spacing: -1px; }
      .h2 { font-size: 24px; font-weight: 800; }
      .pillText { font-size: 16px; font-weight: 750; }
    </style>
  </defs>

  <rect class="screen" width="1600" height="980" rx="0"/>
  <circle cx="378" cy="188" r="225" fill="#6e3679" opacity="0.13" filter="url(#glow)"/>
  <circle cx="1120" cy="680" r="310" fill="#8d3d92" opacity="0.09" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="25" y="22" width="1550" height="340" rx="20" class="panel"/>
    <g transform="translate(60 72)">
      <rect x="0" y="0" width="58" height="58" rx="16" fill="#3996ff"/>
      <path d="M30 9L47 49H39L35 39H22L18 49H10L27 9H30ZM24 32H33L29 21L24 32Z" fill="#f4f8ff"/>
      <path d="M29 3V55M4 29H54" stroke="#d8e9ff" stroke-opacity="0.38" stroke-width="2"/>
    </g>
    <text x="140" y="70" class="label" font-size="17">NETWORK IPAM</text>
    <text x="140" y="128" class="text title">ATLAS</text>
    <text x="140" y="164" class="text" font-size="23" font-weight="750">Home Labs</text>
    <text x="140" y="200" class="muted body">
      <tspan x="140" dy="0">Modular network</tspan>
      <tspan x="140" dy="28">and infrastructure</tspan>
      <tspan x="140" dy="28">control without</tspan>
      <tspan x="140" dy="28">extra complexity.</tspan>
    </text>

    <rect x="965" y="44" width="575" height="276" rx="24" class="panel-soft"/>
    <rect x="983" y="111" width="539" height="190" rx="18" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
    <rect x="1434" y="62" width="90" height="41" rx="17" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
    <text x="1479" y="88" text-anchor="middle" class="text pillText">Bohdan</text>
    <rect x="998" y="126" width="509" height="48" rx="24" fill="url(#accent)" stroke="#ffceff" stroke-opacity=".55" stroke-width="1.5"/>
    <text x="1253" y="157" text-anchor="middle" fill="#210826" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="850">Add</text>
    <rect x="998" y="186" width="249" height="45" rx="22" class="button"/>
    <rect x="1258" y="186" width="249" height="45" rx="22" class="button"/>
    <rect x="998" y="244" width="249" height="45" rx="22" class="button"/>
    <text x="1122" y="213" text-anchor="middle" class="text pillText">Export</text>
    <text x="1383" y="213" text-anchor="middle" class="text pillText">Settings</text>
    <text x="1122" y="272" text-anchor="middle" class="text pillText">Import</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="25" y="378" width="296" height="106" rx="18" class="panel-soft"/>
    <rect x="337" y="378" width="296" height="106" rx="18" class="panel-soft"/>
    <rect x="649" y="378" width="296" height="106" rx="18" class="panel-soft"/>
    <rect x="961" y="378" width="296" height="106" rx="18" class="panel-soft"/>
    <rect x="1273" y="378" width="296" height="106" rx="18" class="panel-soft"/>
    <text x="47" y="413" class="label" font-size="15">SUBNETS</text>
    <text x="47" y="455" class="text metric">1</text>
    <text x="359" y="413" class="label" font-size="15">USED IPS</text>
    <text x="359" y="455" class="text metric">21</text>
    <text x="671" y="413" class="label" font-size="15">FREE IN POOLS</text>
    <text x="671" y="455" class="text metric">79</text>
    <text x="983" y="413" class="label" font-size="15">DEVICES</text>
    <text x="983" y="455" class="text metric">21</text>
    <text x="1295" y="413" class="label" font-size="15">SERVICES</text>
    <text x="1295" y="455" class="text metric">2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="624" y="502" width="346" height="62" rx="31" class="panel-soft"/>
    <rect x="636" y="511" width="118" height="44" rx="22" fill="rgba(230,108,255,.35)" stroke="#da91e8" stroke-opacity=".55" stroke-width="1.5"/>
    <text x="695" y="540" text-anchor="middle" class="text pillText">Dashboard</text>
    <text x="809" y="540" text-anchor="middle" class="muted pillText">Registry</text>
    <text x="914" y="540" text-anchor="middle" class="muted pillText">History</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="25" y="582" width="765" height="373" rx="20" class="panel"/>
    <text x="47" y="619" class="label" font-size="15">OVERVIEW</text>
    <text x="47" y="654" class="text h2">Current state</text>
    <text x="47" y="704" class="muted body">
      <tspan x="47" dy="0">This view keeps only</tspan>
      <tspan x="47" dy="27">the signals that help</tspan>
      <tspan x="47" dy="27">you understand what</tspan>
      <tspan x="47" dy="27">needs attention right now.</tspan>
    </text>
    <g transform="translate(47 817)">
      <rect x="0" y="-142" width="706" height="78" rx="14" fill="rgba(44,53,62,.58)" stroke="url(#okLine)" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="0" y="-52" width="706" height="78" rx="14" fill="rgba(44,53,62,.58)" stroke="url(#okLine)" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="0" y="38" width="706" height="78" rx="14" fill="rgba(76,43,38,.54)" stroke="#c4773e" stroke-opacity=".7" stroke-width="1.5"/>
      <text x="18" y="-110" class="text small" font-weight="800">IP conflicts</text>
      <text x="18" y="-82" class="muted small">Addresses assigned to more than one device.</text>
      <text x="662" y="-96" text-anchor="middle" class="text" font-size="28" font-weight="850">0</text>
      <text x="18" y="-20" class="text small" font-weight="800">Placement issues</text>
      <text x="18" y="8" class="muted small">Devices outside pools or without a matching subnet.</text>
      <text x="662" y="-6" text-anchor="middle" class="text" font-size="28" font-weight="850">0</text>
      <text x="18" y="70" class="text small" font-weight="800">Nearly full groups</text>
      <text x="18" y="98" class="muted small">Ranges with no more than two free IPs left.</text>
      <text x="662" y="84" text-anchor="middle" class="text" font-size="28" font-weight="850">2</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="582" width="765" height="373" rx="20" class="panel"/>
    <text x="828" y="619" class="label" font-size="15">AUDIT</text>
    <text x="828" y="654" class="text h2">Recent changes</text>
    <text x="828" y="704" class="muted body">
      <tspan x="828" dy="0">Recent events help</tspan>
      <tspan x="828" dy="27">you quickly</tspan>
      <tspan x="828" dy="27">understand who</tspan>
      <tspan x="828" dy="27">changed what in the</tspan>
      <tspan x="828" dy="27">infrastructure database.</tspan>
    </text>
    <rect x="828" y="814" width="720" height="85" rx="16" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
    <text x="846" y="847" class="text small" font-weight="850">ATLAS</text>
    <text x="846" y="873" class="muted small">History cleared · --</text>
    <rect x="846" y="883" width="82" height="35" rx="17" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.13)" stroke-width="1.5"/>
    <text x="887" y="906" text-anchor="middle" class="text" font-size="16" font-weight="800">Bohdan</text>
    <rect x="940" y="883" width="178" height="35" rx="17" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.13)" stroke-width="1.5"/>
    <text x="1029" y="906" text-anchor="middle" class="muted" font-size="16" font-weight="800">5/7/26, 9:46:18 PM</text>
  </g>
</svg>
